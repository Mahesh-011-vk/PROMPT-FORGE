services:
  - type: web
    name: promptforge-ai
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DEFAULT_PROVIDER
        value: mock
      - key: SECRET_KEY
        generateValue: true
      - key: USE_IN_MEMORY_CACHE
        value: "true"
      - key: VECTOR_DB_TYPE
        value: memory
      - key: DATABASE_URL
        fromDatabase:
          name: promptforge-db
          property: connectionString

databases:
  - name: promptforge-db
    plan: free
    databaseName: promptforge_db
    user: promptforge
